[project]
name = "afya-api"
version = "0.1.0"
description = "Afya Triage Watch: API and LangGraph agent"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "itsdangerous",
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain-ollama",
  "psycopg[binary,pool]>=3.2",
  "httpx",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["afya_api"]
known-third-party = ["afya_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../mcp/tests"]
markers = ["integration: needs the running Postgres (TEST_DATABASE_URL as afya_app); skipped when unreachable"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["afya_api"]
