# Afya Triage Watch — one-command stack (architecture v4.1)
#   cp .env.example .env   # then set the passwords
#   docker compose up --build
# Only the nurse UI is published, on 127.0.0.1:3000. Everything else stays on private networks.
# The LLM runs on the host (Ollama on the GPU). For a CPU-only container instead:
#   docker compose --profile ollama up --build   (and set OLLAMA_BASE_URL=http://ollama:11434)

name: afya

services:
  # ---------- data ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set PG_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: afya
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d afya"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: creates roles, schemas, tables, grants and audit triggers.
  # The only service that knows the superuser and owner passwords.
  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGDATABASE: afya
      PGUSER: ${PG_SUPERUSER:-postgres}
      PGPASSWORD: ${PG_SUPERUSER_PASSWORD}
      AFYA_OWNER_PASSWORD: ${AFYA_OWNER_PASSWORD:?set AFYA_OWNER_PASSWORD in .env}
      AFYA_APP_PASSWORD: ${AFYA_APP_PASSWORD:?set AFYA_APP_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/init.sh"]
    networks: [app]
    restart: "no"

  # One-shot: LangGraph checkpoint tables (schema lg), created by the owner role.
  lg-init:
    build: { context: ., dockerfile: api/Dockerfile }   # repo root: the api also installs mcp/ (afya_mcp.workflow)
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      OWNER_DATABASE_URL: postgresql://afya_owner:${AFYA_OWNER_PASSWORD}@postgres:5432/afya
      OWNER_TEST_DATABASE_URL: postgresql://afya_owner:${AFYA_OWNER_PASSWORD}@postgres:5432/afya_test
    command: ["python", "-m", "afya_api.lg_setup"]
    networks: [app]
    restart: "no"

  # ---------- FHIR ----------
  # HAPI FHIR with its built-in H2 database. Never published; only nginx and afya-mcp reach it.
  # One-shot: the HAPI image is distroless and runs as uid 65532, a fresh named volume is root-owned.
  hapi-perms:
    image: postgres:16-alpine   # already pulled for postgres; only needs chown
    user: "0"
    entrypoint: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - hapidata:/data
    network_mode: none
    restart: "no"

  hapi:
    image: hapiproject/hapi:v8.4.0-2
    depends_on:
      hapi-perms: { condition: service_completed_successfully }
    environment:
      hapi.fhir.fhir_version: R4
      # The image default is an in-memory H2 (jdbc:h2:mem:test_mem). Use a file DB on the volume.
      spring.datasource.url: jdbc:h2:file:/data/h2/hapi;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
      spring.datasource.username: sa
      spring.datasource.password: ""
      spring.datasource.driverClassName: org.h2.Driver
    volumes:
      - hapidata:/data   # H2 file database survives restarts
    networks: [fhir_rw]

  # Read-only gateway in front of HAPI for the borrowed WSO2 server: GET only.
  gateway:
    image: nginx:1.27-alpine
    depends_on: [hapi]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [fhir_ro, fhir_rw]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      retries: 20

  # Borrowed MCP server (Apache-2.0). Reaches HAPI only through the gateway.
  wso2-fhir-mcp:
    image: ghcr.io/wso2/fhir-mcp-server@sha256:52443bfe53dda032ceab5232163570976887d00bce2c635c3875c29d988ff2c1   # digest of :latest (0.11.0 build); the 0.11.0 tag is not published on ghcr
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      FHIR_SERVER_BASE_URL: http://gateway/fhir
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: "8000"
      FHIR_SERVER_DISABLE_AUTHORIZATION: "True"   # private network only; see README
    # E12-3: its own network with the api only. It is not on "mcp", so it cannot reach afya-mcp's mounts.
    networks: [fhir_ro, borrowed]

  # ---------- authorization (E13-3) ----------
  # OAuth 2.1 authorization server for afya-mcp: Authelia (Apache-2.0, ~60 MB RAM), pinned by digest. Service
  # identities only (client_credentials); RFC 8414 metadata, RFC 8707 resource indicators, RFC 9068 JWT access
  # tokens. Internal network "auth" only (api, afya-mcp), HTTPS with a local CA. Config: auth/configuration.yml.
  # One-shot: local CA, server certificate, signing key, internal secrets, client-secret digest (auth/init.sh).
  auth-init:
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    entrypoint: ["sh", "/auth/init.sh"]
    environment:
      AFYA_MCP_CLIENT_SECRET: ${AFYA_MCP_CLIENT_SECRET:?set AFYA_MCP_CLIENT_SECRET in .env}
    volumes:
      - ./auth:/auth:ro
      - authdata:/data
      - authca:/ca
      - mcptls:/mcp-tls
    network_mode: none
    restart: "no"

  auth:
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    depends_on:
      auth-init: { condition: service_completed_successfully }
    user: "8000:8000"   # files prepared by auth-init; the image's root default is not needed
    environment:
      X_AUTHELIA_CONFIG: /auth/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template
    volumes:
      - ./auth:/auth:ro
      - authdata:/data
    networks:
      auth:
        aliases: [auth.afya.internal]   # the issuer's host name (it must sit under the configured cookie domain)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:9091/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------- our code ----------
  # Our MCP server: /read/mcp (model-facing tools) and /act/mcp (executor only).
  afya-mcp:
    build: ./mcp
    command: ["uvicorn", "afya_mcp.server:app", "--host", "0.0.0.0", "--port", "9000",
              "--ssl-keyfile", "/mcp-tls/server.private.pem", "--ssl-certfile", "/mcp-tls/server.public.crt"]
    depends_on:
      db-init: { condition: service_completed_successfully }
      auth: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://afya_app:${AFYA_APP_PASSWORD}@postgres:5432/afya
      FHIR_BASE_URL: http://hapi:8080/fhir   # internal, write-capable URL
      RULES_DIR: /rules
      DEMO_MODE: ${DEMO_MODE:-1}   # seed_demo_visit refuses unless 1
      # E13-3: protected resource. Every mount needs a JWT access token from this issuer, for that mount
      # (audience <base>/<mount>/mcp) with its scope. Holds no client secret; fetches only the issuer's public keys.
      AFYA_AUTH_ISSUER: https://auth.afya.internal:9091
      AFYA_MCP_RESOURCE_BASE: https://afya-mcp:9000
      AFYA_AUTH_CA_FILE: /auth-ca/ca.crt
    volumes:
      - ./rules:/rules:ro
      - authca:/auth-ca:ro
      - mcptls:/mcp-tls:ro
    networks: [fhir_rw, mcp, app, auth]

  # E2-6: explicit one-shot loader; never run automatically with the application.
  seed:
    profiles: ["seed"]
    build: ./mcp
    depends_on:
      db-init: { condition: service_completed_successfully }
      hapi: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://afya_app:${AFYA_APP_PASSWORD}@postgres:5432/afya
      FHIR_BASE_URL: http://hapi:8080/fhir
      RULES_DIR: /rules
      DEMO_MODE: ${DEMO_MODE:-1}
      DATA_CLASSIFICATION: ${DATA_CLASSIFICATION:-synthetic}
      PYTHONPATH: /workspace
    volumes:
      - ./seed:/workspace/seed:ro
      - ./evals:/workspace/evals:ro
      - ./rules:/rules:ro
    command: ["python", "-m", "seed"]
    networks: [fhir_rw, app]

  api:
    build: { context: ., dockerfile: api/Dockerfile }   # repo root: the api also installs mcp/ (afya_mcp.workflow)
    depends_on:
      lg-init: { condition: service_completed_successfully }
      afya-mcp: { condition: service_started }
      wso2-fhir-mcp: { condition: service_started }
      auth: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://afya_app:${AFYA_APP_PASSWORD}@postgres:5432/afya
      AFYA_MCP_READ_URL: https://afya-mcp:9000/read/mcp
      AFYA_MCP_ACT_URL: https://afya-mcp:9000/act/mcp
      AFYA_MCP_UI_URL: https://afya-mcp:9000/ui/mcp   # read-only data for the screens (timeline, demo)
      RULES_DIR: /rules                              # site.yaml: clinician reminder limits for /proposals
      # E13-3: OAuth 2.1 client credentials for afya-mcp (one token per mount, its scope only; never sent to WSO2)
      AFYA_AUTH_ISSUER: https://auth.afya.internal:9091
      AFYA_AUTH_CA_FILE: /auth-ca/ca.crt
      AFYA_MCP_CLIENT_ID: afya-api
      AFYA_MCP_CLIENT_SECRET: ${AFYA_MCP_CLIENT_SECRET:?set AFYA_MCP_CLIENT_SECRET in .env}
      WSO2_MCP_URL: http://wso2-fhir-mcp:8000/mcp                      # on the "borrowed" network
      # E5-11: always an open-weights model. Pick the provider with MODEL_PROVIDER in .env: ollama_cloud (default),
      # groq, openrouter, or a local Ollama (ollama); each provider's model comes from its own variable.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama_cloud}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-gpt-oss:120b}   # a name from GET https://ollama.com/api/tags
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}                       # api only; empty = rules only (model_unavailable)
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}           # Apache-2.0 open weights (backup: qwen/qwen3.8-27b)
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_CONCURRENCY: ${GROQ_CONCURRENCY:-1}                  # free plan: 8K tokens/min, one call at a time
      GROQ_API_KEY: ${GROQ_API_KEY:-}                           # api only; empty = rules only (model_unavailable)
      MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT:-}       # Groq; empty = "low" for gpt-oss, off otherwise
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-30b-a3b-instruct-2507}
      OPENROUTER_PROVIDER: ${OPENROUTER_PROVIDER:-nebius/fp8}   # pinned, no fallback to another provider
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}               # empty = rules only (model_unavailable notice)
      DATA_CLASSIFICATION: ${DATA_CLASSIFICATION:-synthetic}    # anything else refuses the remote provider
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MODEL: ${MODEL:-qwen3:8b}             # Ollama tag (MODEL_PROVIDER=ollama only)
      MODEL_KEEP_ALIVE: ${MODEL_KEEP_ALIVE:--1}   # Ollama: keep the model loaded (no cold load during a demo)
      MODEL_SEED: ${MODEL_SEED:-42}         # base seed; each run's seed is derived from it and logged (E5-9)
      MODEL_ENABLED: ${MODEL_ENABLED:-1}    # 0 = rules only (the agent still scores, triggers and proposes)
      DEMO_MODE: ${DEMO_MODE:-1}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WATCH_INTERVAL_SECONDS: ${WATCH_INTERVAL_SECONDS:-60}
    volumes:
      - ./rules:/rules:ro
      - authca:/auth-ca:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app, mcp, borrowed, web, auth]

  # Nurse UI (Next.js production build, web/Dockerfile).
  web:
    build: ./web
    profiles: ["web"]
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:8080
      DEMO_MODE: ${DEMO_MODE:-0}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [web]

  # Optional CPU-only model server (slow). Default is Ollama on the host GPU.
  ollama:
    image: ollama/ollama:0.6.8
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    networks: [web]

networks:
  app: { internal: true }       # postgres, db-init, lg-init, afya-mcp, api
  mcp: { internal: true }       # api <-> afya-mcp (OAuth access tokens, E13-3)
  auth: { internal: true }      # api, afya-mcp <-> auth (the authorization server); not WSO2, not the web UI
  borrowed: { internal: true }  # api <-> wso2-fhir-mcp only (E12-3: WSO2 runs with authorization disabled)
  fhir_ro: { internal: true }   # wso2-fhir-mcp <-> gateway  (WSO2 cannot resolve "hapi")
  fhir_rw: { internal: true }   # gateway, afya-mcp <-> hapi
  web: {}                       # web <-> api, plus outbound for api (host Ollama, OpenRouter)

volumes:
  pgdata:
  hapidata:
  ollama:
  authdata:   # authorization server: private keys, secrets, SQLite (auth-init and auth only)
  authca:     # the local CA certificate (public), trusted by api and afya-mcp
  mcptls:    # protected MCP TLS private key/certificate: auth-init writes, only afya-mcp reads
