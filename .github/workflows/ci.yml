name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e "./mcp[dev]"
          pip install -e "./api[dev]"
      - name: ruff (mcp)
        run: cd mcp && ruff check afya_mcp tests
      - name: ruff (api)
        run: cd api && ruff check afya_api
      - name: pytest (mcp)
        run: cd mcp && pytest -q
      - name: mypy (mcp, reported only until the existing errors are fixed)
        continue-on-error: true
        run: cd mcp && mypy afya_mcp

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Fixtures match docs/api.md
        run: npm run fixtures && git diff --exit-code -- src/api/fixtures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Playwright (P-014 end to end, fake API)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
