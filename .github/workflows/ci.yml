name: CI

on:
  push:
  pull_request:

jobs:
  group-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: afya-e8-2-ci
      COMPOSE_FILE: docker-compose.yml:evals/stack/compose.yml
      MODEL_ENABLED: "0"
      GROUP_A_COMMIT: ${{ github.sha }}
      WATCH_INTERVAL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic isolated test environment
        run: |
          mkdir -p .playwright-mcp/group-a
          cp .env.example .env
          for v in PG_SUPERUSER_PASSWORD AFYA_OWNER_PASSWORD AFYA_APP_PASSWORD SESSION_SECRET AFYA_MCP_CLIENT_SECRET; do
            sed -i "s|^$v=.*|$v=$(openssl rand -hex 24)|" .env
          done
          sed -i 's|^MODEL_ENABLED=.*|MODEL_ENABLED=0|; s|^DEMO_MODE=.*|DEMO_MODE=1|' .env
      - name: Build and start real services with the test-only fault boundary
        run: |
          docker compose --profile web --profile checks up -d --build web fhir-fault
          docker compose --profile checks build group-a
      - name: Group A real-stack pytest
        run: docker compose --profile checks run --rm --no-deps group-a
      - name: Isolation assertions inside the actual WSO2 container
        run: |
          export GROUP_A_HAPI_IP="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q hapi)")"
          docker compose exec -T -e GROUP_A_HAPI_IP wso2-fhir-mcp python -m pytest /checks/test_isolation.py -q -p no:cacheprovider --junitxml=/tmp/group-a-isolation.xml
          docker compose cp wso2-fhir-mcp:/tmp/group-a-isolation.xml .playwright-mcp/group-a/isolation.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser emulator
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Desktop and mobile approval flows with screenshots
        working-directory: web
        run: npm run test:group-a
      - name: Group A service logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-a-evidence
          path: .playwright-mcp/group-a/
      - name: Remove only the disposable Group A test project
        if: always()
        run: docker compose --profile web --profile checks down --volumes

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e "./mcp[dev]"
          pip install -e "./api[dev]"
      - name: ruff (mcp)
        run: cd mcp && ruff check afya_mcp tests
      - name: ruff (api)
        run: cd api && ruff check afya_api
      - name: pytest (mcp)
        run: cd mcp && pytest -q
      - name: pytest (evals, including the E5-1 dataset contract)
        run: pytest evals/tests -q
      - name: ruff (synthetic seed job)
        run: ruff check seed evals/tests/test_seed.py
      - name: pytest (WSO2 projection adapter)
        run: cd api && pytest tests/test_fhir_projection.py -q
      - name: pytest (MCP service authentication and client transport)
        run: cd api && pytest tests/test_mcp_client.py -q
      - name: mypy (mcp, reported only until the existing errors are fixed)
        continue-on-error: true
        run: cd mcp && mypy afya_mcp

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # E7-10 / E7-11: the P-014 flow against the real compose stack (no fake API). No GPU here, so the model is off
  # (rules only); the test checks quote highlights only when the sign mapper ran.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: .env with random secrets, model off
        run: |
          cp .env.example .env
          for v in PG_SUPERUSER_PASSWORD AFYA_OWNER_PASSWORD AFYA_APP_PASSWORD SESSION_SECRET AFYA_MCP_CLIENT_SECRET; do
            sed -i "s|^$v=.*|$v=$(openssl rand -hex 24)|" .env
          done
          sed -i 's|^MODEL_ENABLED=.*|MODEL_ENABLED=0|; s|^DEMO_MODE=.*|DEMO_MODE=1|' .env
      - name: Start the stack
        run: docker compose --profile web up -d --build
      - name: Wait for the UI, the API and HAPI
        run: |
          for i in $(seq 1 90); do
            if curl -sf -c /tmp/cj -H 'content-type: application/json' -d '{"user_id":"nurse-a"}'                  http://127.0.0.1:3000/api/login-as >/dev/null                && curl -sf -b /tmp/cj http://127.0.0.1:3000/api/queue | jq -e '[.notices[].code] | index("fhir_unavailable") | not' >/dev/null; then
              echo "ready after $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          docker compose ps; exit 1
      - name: WSO2 native projection and read-only isolation (synthetic records, no model)
        run: |
          export WSO2_CHECK_FIXTURE="$(docker compose exec -T afya-mcp python - seed < scripts/verify_wso2.py)"
          docker compose exec -T -e WSO2_CHECK_FIXTURE api python - check < scripts/verify_wso2.py
          docker compose exec -T wso2-fhir-mcp python - isolation < scripts/verify_wso2.py
          docker compose exec -T -e WSO2_CHECK_FIXTURE afya-mcp python - finish < scripts/verify_wso2.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Generated API types match the running API
        working-directory: web
        run: npm run gen:api && git diff --exit-code -- src/api/types.ts
      - name: Playwright (P-014 end to end, real stack)
        working-directory: web
        run: npm run test:e2e
      - name: Seed twenty synthetic patients twice
        run: |
          docker compose --profile seed run --build --rm seed
          docker compose --profile seed run --rm seed
      - name: Seeded waiting room (desktop and mobile emulation)
        working-directory: web
        run: npx playwright test --config playwright.seed.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-browser-evidence
          path: .playwright-mcp/seed/browser/
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  mcp-conformance:
    name: MCP application regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e "mcp[dev]" -e "api[dev]"
      - name: Test conformance drivers and fail-closed report gate
        run: python -m pytest scripts/tests/test_conformance_setup.py -q
      - name: Start actual MCP app behind the offline test issuer
        run: |
          PYTHONPATH=mcp nohup python -m uvicorn conformance_app:app --app-dir scripts --port 9100 > conformance-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:9100/healthz && break; sleep 1; done
          curl -fs http://localhost:9100/healthz
      - name: Record full official server results without failure waivers
        id: server
        continue-on-error: true
        run: |
          rc=0
          for m in read act ui; do
            code=0
            npx -y @modelcontextprotocol/conformance@0.2.0-alpha.12 server --url http://localhost:9100/$m/mcp \
              --requirements 2026-07-28 -o conformance-out/server-$m || code=$?
            # 1 is the raw suite's non-conformance result, not a pass. The report gate below checks every result.
            if [ "$code" -gt 1 ]; then rc=1; fi
          done
          exit $rc
      - name: Record full official client results without failure waivers
        id: client
        if: always()
        continue-on-error: true
        run: |
          code=0
          PYTHONPATH=api npx -y @modelcontextprotocol/conformance@0.2.0-alpha.12 client \
            --command "python scripts/conformance_client.py" --requirements 2026-07-28 \
            -o conformance-out/client || code=$?
          test "$code" -le 1
      - name: Probe actual Afya tools and known SDK error handling
        if: always()
        run: python scripts/conformance_probe.py --output conformance-out/probes.json
      - name: Gate application scope and publish honest coverage report
        if: always()
        run: |
          python scripts/conformance_scope.py --root conformance-out
          test "${{ steps.server.outcome }}" = success
          test "${{ steps.client.outcome }}" = success
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-application-regression-evidence
          path: |
            conformance-out
            conformance-server.log
