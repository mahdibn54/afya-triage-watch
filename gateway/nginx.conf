# Read-only FHIR gateway (architecture v4.1, section 14).
# The borrowed WSO2 FHIR MCP server reaches HAPI only through here.
# WSO2 v0.11.0 search and read both use GET, so nothing else is allowed.

events {}

http {
    server_tokens off;

    # Reject path tricks in the raw URI before the query string:
    # ";" (Tomcat path params), "..", encoded dots/slashes/semicolons, and "$operations".
    map $request_uri $bad_path {
        default                                   0;
        "~*^[^?]*(;|\.\.|%2e|%2f|%3b|%5c|\$)"     1;
    }

    server {
        listen 80;

        location = /healthz {
            return 200 "ok\n";
        }

        location /fhir/ {
            if ($bad_path) { return 403; }

            limit_except GET {   # GET (and HEAD) only: no POST, PUT, PATCH, DELETE
                deny all;
            }

            proxy_set_header X-HTTP-Method-Override "";
            proxy_set_header X-HTTP-Method "";
            proxy_set_header X-Method-Override "";
            proxy_set_header Host $host;
            proxy_pass http://hapi:8080;   # no URI part: the raw request URI is passed unchanged
        }

        location / {
            return 403;
        }
    }
}
